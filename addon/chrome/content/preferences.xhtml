<linkset>
  <html:link rel="localization" href="__addonRef__-preferences.ftl" />
</linkset>
<vbox
  id="zotero-prefpane-__addonRef__"
  onload="Zotero.__addonInstance__.hooks.onPrefsEvent('load', {window})"
>
  <groupbox>
    <label>
      <html:h2 data-l10n-id="pref-title"></html:h2>
    </label>
    <checkbox
      id="zotero-prefpane-__addonRef__-auto-write"
      data-l10n-id="pref-auto-write"
    />
    <html:label
      class="zotero-text-link"
      data-l10n-id="pref-auto-write-help"
    ></html:label>
  </groupbox>
  <groupbox>
    <label>
      <html:h3 data-l10n-id="pref-debounce-title"></html:h3>
    </label>
    <html:input
      id="zotero-prefpane-__addonRef__-debounce"
      type="number"
      min="0"
      step="100"
      style="width: 8em"
    />
    <html:label data-l10n-id="pref-debounce-help"></html:label>
  </groupbox>
</vbox>
<vbox>
  <html:label
    data-l10n-id="pref-help"
    data-l10n-args='{"time": "__buildTime__","name": "__addonName__","version":"__buildVersion__"}'
  ></html:label>
</vbox>
